<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <base href="/cosmic/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · AI 未来星域社区</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主内容</a>
  <div class="canvas-bg" aria-hidden="true">
    <canvas id="cosmic-canvas"></canvas>
  </div>

  <header class="site-header">
    <a href="./index.html" class="brand" aria-label="AI 未来星域社区">
      <span class="brand-mark">✦</span>
      <span class="brand-text">AI 未来星域社区</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="./resource.html">知识</a>
      <a href="./tools.html">工具</a>
      <button id="nav-auth" class="btn btn-ghost" type="button">登录</button>
    </nav>
  </header>

  <main id="main-content" class="auth-wrap">
    <section class="auth-card glass">
      <h1>欢迎回来</h1>
      <p class="auth-sub">登录到 AI 未来星域社区</p>

      <button class="btn btn-gh" id="gh-login" type="button">
        <span aria-hidden="true">⌥</span> 使用 GitHub 登录
      </button>

      <div class="auth-divider"><span>或</span></div>

      <form class="auth-form" id="login-form" novalidate>
        <label>
          <span class="visually-hidden">邮箱</span>
          <input type="email" name="email" placeholder="邮箱" required autocomplete="email" aria-invalid="false">
        </label>
        <label>
          <span class="visually-hidden">密码</span>
          <input type="password" name="password" placeholder="密码" required autocomplete="current-password" minlength="6" aria-invalid="false">
        </label>
        <button type="submit" class="btn btn-primary">登录</button>
      </form>

      <p class="auth-foot">
        还没账号？<a href="./register.html">立即注册</a>
      </p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
  <script type="module" src="cosmic-scene.js"></script>
</body>
</html>
