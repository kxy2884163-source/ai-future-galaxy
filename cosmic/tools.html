<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <base href="/cosmic/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230a0a1a%22/%3E%3Ctext x=%2250%22 y=%2272%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22%237df9ff%22 font-family=%22sans-serif%22%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
  插件工具 · AI 未来星域社区</title>
  <meta name="description" content="常用 AI 插件工具 · 收敛碎片工具到一个入口 · 一键直跳">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* § Tools 页面容器 */
    .tools-wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: var(--space-7) var(--space-5) var(--space-9);
    }

    /* § Page header */
    .page-head {
      text-align: center;
      margin-bottom: var(--space-7);
    }
    .page-head h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      margin-bottom: var(--space-3);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-head p {
      color: var(--fg-mute);
      font-size: 16px;
    }

    /* § Filter pills */
    .tool-filter {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: var(--space-6);
      padding: var(--space-3);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
    }
    .filter-pill {
      padding: 6px 16px;
      border-radius: var(--radius);
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--fg-mute);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .filter-pill:hover {
      background: var(--glass-strong);
      color: var(--fg);
    }
    .filter-pill[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--bg-0);
      border-color: transparent;
      font-weight: 600;
    }

    /* § Tool grid */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .tool-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-5);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      -webkit-backdrop-filter: blur(var(--blur));
      backdrop-filter: blur(var(--blur));
      text-decoration: none;
      color: var(--fg);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }
    .tool-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 12px 32px rgba(125, 249, 255, 0.15);
      text-decoration: none;
    }
    .tool-icon {
      font-size: 36px;
      filter: drop-shadow(0 0 6px rgba(125, 249, 255, 0.3));
    }
    .tool-name {
      font-size: 18px;
      font-weight: 700;
    }
    .tool-desc {
      color: var(--fg-mute);
      font-size: 13px;
      flex: 1;
    }
    .tool-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--fg-dim);
      padding-top: var(--space-2);
      border-top: 1px solid var(--glass-border);
    }
    .tool-cat {
      padding: 2px 8px;
      background: var(--glass-strong);
      border-radius: var(--radius-sm);
      color: var(--accent);
      font-weight: 500;
    }

    /* § Category section */
    .cat-section {
      margin-bottom: var(--space-7);
    }
    .cat-section > h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: var(--space-4);
      color: var(--fg-mute);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .cat-section > h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-radius: 2px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">跳到主内容</a>
  <div class="canvas-bg" aria-hidden="true">
    <canvas id="cosmic-canvas"></canvas>
  </div>

  <header class="site-header">
    <a href="./index.html" class="brand" aria-label="AI 未来星域社区">
      <span class="brand-mark">✦</span>
      <span class="brand-text">AI 未来星域社区</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="./index.html">社区</a>
      <a href="./resource.html">知识</a>
      <a href="./tools.html" aria-current="page">工具</a>
      <button id="nav-auth" class="btn btn-ghost" type="button">登录</button>
    </nav>
  </header>

  <main id="main-content" class="tools-wrap">
    <header class="page-head">
      <h1>🛠️ 常用插件工具</h1>
      <p>收敛碎片 AI 工具到一个入口 · 一键直跳 · 收藏常用</p>
    </header>

    <!-- Filter pills -->
    <div class="tool-filter" role="tablist" aria-label="工具分类筛选">
      <button class="filter-pill" type="button" data-cat="all" aria-pressed="true">全部</button>
      <button class="filter-pill" type="button" data-cat="writing" aria-pressed="false">📝 写作</button>
      <button class="filter-pill" type="button" data-cat="image" aria-pressed="false">🎨 图像</button>
      <button class="filter-pill" type="button" data-cat="code" aria-pressed="false">💻 编程</button>
      <button class="filter-pill" type="button" data-cat="video" aria-pressed="false">🎬 视频</button>
      <button class="filter-pill" type="button" data-cat="search" aria-pressed="false">🔍 搜索</button>
      <button class="filter-pill" type="button" data-cat="chat" aria-pressed="false">💬 对话</button>
    </div>

    <!-- § Tools 容器（异步从 Supabase 加载 · 2026-07-31 P0 替换 MOCK） -->
    <div id="tools-container" role="region" aria-label="工具列表"></div>
      📦 18 个精选工具 · 6 个分类 · 持续更新中
    </p>
  </main>

  <footer class="site-footer">
    <p>✦ AI 未来星域社区 · 插件工具模块 · v1.0 MVP</p>
  </footer>

  <script type="module" src="app.js"></script>
  <script type="module" src="cosmic-scene.js"></script>
  <script type="module">
    // § Supabase 集成 · P0 替换 MOCK（2026-07-31）
    import { toggleToolFav, getUserToolFavs, fetchTools } from './app.js';

    const LS_TOOL_FAVS = 'cosmic.toolFavs';
    function readTools() {
      try { return JSON.parse(localStorage.getItem(LS_TOOL_FAVS) || '[]'); }
      catch { return []; }
    }
    function writeTools(arr) {
      localStorage.setItem(LS_TOOL_FAVS, JSON.stringify(arr));
    }

    async function setupFavBtn(card, toolId, toolName) {
      let isActive = false;
      try {
        const favs = await getUserToolFavs();
        isActive = favs.includes(toolId);
      } catch (e) {
        isActive = readTools().includes(toolId);
      }

      const btn = document.createElement('button');
      btn.className = 'fav-btn' + (isActive ? ' is-active' : '');
      btn.type = 'button';
      btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      btn.setAttribute('aria-label', '收藏 ' + toolName);
      btn.textContent = isActive ? '★' : '☆';
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const wasActive = btn.classList.contains('is-active');
        btn.classList.toggle('is-active');
        btn.setAttribute('aria-pressed', !wasActive);
        btn.textContent = !wasActive ? '★' : '☆';
        const cur = readTools();
        const idx = cur.indexOf(toolId);
        if (idx >= 0 && wasActive) cur.splice(idx, 1);
        else if (!wasActive) cur.push(toolId);
        writeTools(cur);
        try {
          await toggleToolFav(toolId);
        } catch (e) { /* 未登录时静默 */ }
      });
      card.style.position = 'relative';
      card.appendChild(btn);
    }

    // § 工具分类（渲染顺序）
    const CATEGORIES = [
      { id: 'writing', label: '写作类' },
      { id: 'image',   label: '图像类' },
      { id: 'code',    label: '编程类' },
      { id: 'video',   label: '视频类' },
      { id: 'search',  label: '搜索类' },
      { id: 'chat',    label: '对话类' },
    ];

    function escape(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderTools(tools) {
      const container = document.getElementById('tools-container');
      if (!tools || tools.length === 0) {
        container.innerHTML = `
          <div class="empty" style="text-align:center;padding:60px 20px;">
            <div class="glyph" style="font-size:48px;">✦</div>
            <p style="color:var(--fg-mute);margin-top:16px;">工具加载失败或暂无数据</p>
          </div>`;
        return;
      }

      const byCat = {};
      tools.forEach(t => {
        if (!byCat[t.category]) byCat[t.category] = [];
        byCat[t.category].push(t);
      });

      container.innerHTML = CATEGORIES
        .filter(c => byCat[c.id] && byCat[c.id].length > 0)
        .map(c => `
          <section class="cat-section" data-cat="${c.id}">
            <h2>${escape(c.label)}</h2>
            <div class="tool-grid">
              ${byCat[c.id].map(t => `
                <a class="tool-card" href="${escape(t.url)}" target="_blank" rel="noopener">
                  <div class="tool-icon" aria-hidden="true">${escape(t.icon || '✦')}</div>
                  <h3 class="tool-name">${escape(t.name)}</h3>
                  <p class="tool-desc">${escape(t.description || '')}</p>
                  <div class="tool-meta">
                    <span class="tool-cat">${escape(c.label.replace(/类$/, ''))}</span>
                    <span>★ ${(Number(t.rating) || 0).toFixed(1)}</span>
                  </div>
                </a>
              `).join('')}
            </div>
          </section>
        `).join('');

      container.querySelectorAll('.tool-card').forEach(card => {
        const nameEl = card.querySelector('.tool-name');
        if (!nameEl) return;
        const toolId = nameEl.textContent.trim();
        setupFavBtn(card, toolId, nameEl.textContent);
      });
    }

    function bindFilters() {
      const pills = document.querySelectorAll('.filter-pill');
      const container = document.getElementById('tools-container');

      pills.forEach((p) => {
        p.addEventListener('click', () => {
          const cat = p.dataset.cat;
          pills.forEach((q) => q.setAttribute('aria-pressed', q === p ? 'true' : 'false'));
          const sections = container.querySelectorAll('.cat-section');
          sections.forEach((s) => {
            if (cat === 'all' || s.dataset.cat === cat) {
              s.classList.remove('hidden');
            } else {
              s.classList.add('hidden');
            }
          });
          if (cat !== 'all') {
            const target = container.querySelector(`.cat-section[data-cat="${cat}"]`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const tools = await fetchTools();
        renderTools(tools);
        bindFilters();
      } catch (e) {
        console.warn('fetchTools failed:', e);
        renderTools([]);
        bindFilters();
      }
    });
  </script>
</body>
</html>
